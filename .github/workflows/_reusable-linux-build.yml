name: Reusable Linux build

on:
  workflow_call:
    inputs:
      upload_artifacts:
        description: Upload Linux build artifacts.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    name: Linux x64 Build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            pkg-config \
            libusb-1.0-0-dev \
            libswresample-dev \
            libavutil-dev \
            libflac-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6widgets6 \
            libqt6serialport6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev

      - name: Configure and Build
        working-directory: Linux-Application
        run: |
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j"$(nproc)"

      - name: Package Linux x64 build
        working-directory: Linux-Application
        run: |
          mkdir -p artifacts/DomesdayDuplicator-Linux-x64
          cp build/DomesdayDuplicator/DomesdayDuplicator artifacts/DomesdayDuplicator-Linux-x64/
          cp build/dddconv/dddconv artifacts/DomesdayDuplicator-Linux-x64/
          cp build/dddutil/dddutil artifacts/DomesdayDuplicator-Linux-x64/
          cp DOWNSAMPLING_README.md artifacts/DomesdayDuplicator-Linux-x64/
          cp build_with_system_ffmpeg.sh artifacts/DomesdayDuplicator-Linux-x64/

          cat > artifacts/DomesdayDuplicator-Linux-x64/install.sh << 'EOF'
          #!/bin/bash
          echo "DomesdayDuplicator Linux Installation"
          echo "====================================="
          echo "Prerequisites: libusb, FFmpeg runtime libs, FLAC runtime libs, Qt6 Widgets/SerialPort, OpenGL, xkbcommon"
          PKGS=(libusb-1.0-0 libqt6core6 libqt6gui6 libqt6widgets6 libqt6serialport6 libgl1 libglu1-mesa libxkbcommon0)
          for candidate in libflac12 libflac8; do
            if apt-cache show "$candidate" >/dev/null 2>&1; then
              PKGS+=("$candidate")
              break
            fi
          done
          for candidate in libswresample4 libswresample3; do
            if apt-cache show "$candidate" >/dev/null 2>&1; then
              PKGS+=("$candidate")
              break
            fi
          done
          for candidate in libavutil57 libavutil56; do
            if apt-cache show "$candidate" >/dev/null 2>&1; then
              PKGS+=("$candidate")
              break
            fi
          done
          echo "Install with: sudo apt install ${PKGS[*]}"
          echo ""
          echo "To run: ./DomesdayDuplicator"
          chmod +x DomesdayDuplicator dddconv dddutil
          EOF
          chmod +x artifacts/DomesdayDuplicator-Linux-x64/install.sh

          tar -czf DomesdayDuplicator-Linux-x64.tar.gz -C artifacts DomesdayDuplicator-Linux-x64

      - name: Upload Linux x64 artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: DomesdayDuplicator-Linux-x64
          path: Linux-Application/DomesdayDuplicator-Linux-x64.tar.gz
          retention-days: 30

  build-linux-arm64:
    runs-on: ubuntu-22.04
    name: Linux ARM64 Build
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 binaries in container
        run: |
          docker run --rm --platform=linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/Linux-Application \
            ubuntu:22.04 bash -c "
              apt update && apt install -y \
                build-essential cmake pkg-config \
                libusb-1.0-0-dev libswresample-dev libavutil-dev libflac-dev \
                qt6-base-dev qt6-base-dev-tools libqt6widgets6 \
                libqt6serialport6-dev libgl1-mesa-dev \
                libglu1-mesa-dev libxkbcommon-dev

              export PKG_CONFIG_PATH='/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig'
              cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
              cmake --build build --config Release -j\$(nproc)
            "

      - name: Package Linux ARM64 build
        working-directory: Linux-Application
        run: |
          mkdir -p artifacts/DomesdayDuplicator-Linux-ARM64
          cp build/DomesdayDuplicator/DomesdayDuplicator artifacts/DomesdayDuplicator-Linux-ARM64/
          cp build/dddconv/dddconv artifacts/DomesdayDuplicator-Linux-ARM64/
          cp build/dddutil/dddutil artifacts/DomesdayDuplicator-Linux-ARM64/
          cp DOWNSAMPLING_README.md artifacts/DomesdayDuplicator-Linux-ARM64/
          cp build_with_system_ffmpeg.sh artifacts/DomesdayDuplicator-Linux-ARM64/

          cat > artifacts/DomesdayDuplicator-Linux-ARM64/install.sh << 'EOF'
          #!/bin/bash
          echo "DomesdayDuplicator Linux ARM64 Installation"
          echo "=========================================="
          echo "Prerequisites: libusb, FFmpeg runtime libs, FLAC runtime libs, Qt6 Widgets/SerialPort, OpenGL, xkbcommon"
          PKGS=(libusb-1.0-0 libqt6core6 libqt6gui6 libqt6widgets6 libqt6serialport6 libgl1 libglu1-mesa libxkbcommon0)
          for candidate in libflac12 libflac8; do
            if apt-cache show "$candidate" >/dev/null 2>&1; then
              PKGS+=("$candidate")
              break
            fi
          done
          for candidate in libswresample4 libswresample3; do
            if apt-cache show "$candidate" >/dev/null 2>&1; then
              PKGS+=("$candidate")
              break
            fi
          done
          for candidate in libavutil57 libavutil56; do
            if apt-cache show "$candidate" >/dev/null 2>&1; then
              PKGS+=("$candidate")
              break
            fi
          done
          echo "Install with: sudo apt install ${PKGS[*]}"
          echo ""
          echo "To run: ./DomesdayDuplicator"
          chmod +x DomesdayDuplicator dddconv dddutil
          EOF
          chmod +x artifacts/DomesdayDuplicator-Linux-ARM64/install.sh

          tar -czf DomesdayDuplicator-Linux-ARM64.tar.gz -C artifacts DomesdayDuplicator-Linux-ARM64

      - name: Upload Linux ARM64 artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: DomesdayDuplicator-Linux-ARM64
          path: Linux-Application/DomesdayDuplicator-Linux-ARM64.tar.gz
          retention-days: 30

  build-linux-appimage:
    runs-on: ubuntu-22.04
    name: Linux AppImage Build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            pkg-config \
            libusb-1.0-0-dev \
            libswresample-dev \
            libavutil-dev \
            libflac-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6widgets6 \
            libqt6serialport6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            desktop-file-utils \
            appstream \
            patchelf \
            wget \
            file \
            fuse \
            libfuse2

      - name: Configure and Build
        working-directory: Linux-Application
        run: |
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j"$(nproc)"

      - name: Prepare AppDir
        working-directory: Linux-Application
        run: |
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp build/DomesdayDuplicator/DomesdayDuplicator "$APPDIR/usr/bin/"
          cp build/dddconv/dddconv "$APPDIR/usr/bin/"
          cp build/dddutil/dddutil "$APPDIR/usr/bin/"

          cat > "$APPDIR/usr/share/applications/domesdayduplicator.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=DomesdayDuplicator
          Exec=DomesdayDuplicator
          Icon=domesdayduplicator
          Categories=AudioVideo;Utility;
          Terminal=false
          EOF

          cp DomesdayDuplicator/Graphics/ApplicationIcon/DomesdayDuplicator_256x256.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/domesdayduplicator.png"

      - name: Build AppImage
        working-directory: Linux-Application
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/lib/qt6/bin/qmake6
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          LDCONFIG_BIN="$(command -v ldconfig || true)"
          if [ -z "$LDCONFIG_BIN" ]; then
            if [ -x /sbin/ldconfig ]; then
              LDCONFIG_BIN=/sbin/ldconfig
            elif [ -x /usr/sbin/ldconfig ]; then
              LDCONFIG_BIN=/usr/sbin/ldconfig
            else
              echo "Unable to locate ldconfig for runtime library resolution"
              exit 1
            fi
          fi

          LIBUSB_SO="$("$LDCONFIG_BIN" -p | awk '/libusb-1\.0\.so\.0/{print $NF; exit}')"
          LIBSWRESAMPLE_SO="$("$LDCONFIG_BIN" -p | awk '/libswresample\.so/{print $NF; exit}')"
          LIBAVUTIL_SO="$("$LDCONFIG_BIN" -p | awk '/libavutil\.so/{print $NF; exit}')"
          LIBFLAC_SO="$("$LDCONFIG_BIN" -p | awk '/libFLAC\.so/{print $NF; exit}')"

          for lib_var in LIBUSB_SO LIBSWRESAMPLE_SO LIBAVUTIL_SO LIBFLAC_SO; do
            lib_path="${!lib_var:-}"
            if [ -z "$lib_path" ] || [ ! -f "$lib_path" ]; then
              echo "Failed to resolve required runtime library for $lib_var"
              exit 1
            fi
          done

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/DomesdayDuplicator \
            --executable AppDir/usr/bin/dddconv \
            --executable AppDir/usr/bin/dddutil \
            --desktop-file AppDir/usr/share/applications/domesdayduplicator.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/domesdayduplicator.png \
            --library "$LIBUSB_SO" \
            --library "$LIBSWRESAMPLE_SO" \
            --library "$LIBAVUTIL_SO" \
            --library "$LIBFLAC_SO" \
            --plugin qt \
            --output appimage

          mkdir -p artifacts
          mv ./*.AppImage artifacts/

      - name: Upload Linux AppImage artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: DomesdayDuplicator-Linux-AppImage
          path: Linux-Application/artifacts/*.AppImage
          retention-days: 30
